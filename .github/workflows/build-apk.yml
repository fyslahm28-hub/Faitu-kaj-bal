name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Debug Keystore & Firebase Config for CI Build
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > "${GITHUB_WORKSPACE}/debug.keystore"
          else
            cat << 'EOF' | base64 -d > "${GITHUB_WORKSPACE}/debug.keystore"
          
          EOF
          fi

          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "629586749547",
              "project_id": "gen-lang-client-0048059944",
              "storage_bucket": "gen-lang-client-0048059944.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:629586749547:android:7000d427f8ef952b29292e",
                  "android_client_info": {
                    "package_name": "com.aistudio.qawmikormo.khedmt"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "629586749547-ia6cd950d81nioteuamgrlktof3pksqq.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.qawmikormo.khedmt",
                      "certificate_hash": "50a99a090dc181a418bb43bb4d1a56f0591fbc46"
                    }
                  },
                  {
                    "client_id": "629586749547-ubgo99u8c72n63t1pujt7dlof51mqn5e.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyA741d3nFPja5GipgQ4oA0SWnrSysfAVTk"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "629586749547-ubgo99u8c72n63t1pujt7dlof51mqn5e.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qawmi-Kormosangsthan-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: "Automatic build from GitHub Actions"
          
